name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinelai
          POSTGRES_PASSWORD: sentinelai_password
          POSTGRES_DB: sentinelai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://sentinelai:sentinelai_password@localhost:5432/sentinelai

      - name: Run unit tests
        working-directory: backend
        run: npm run test
        env:
          DATABASE_URL: postgresql://sentinelai:sentinelai_password@localhost:5432/sentinelai
          REDIS_URL: redis://localhost:6379

      - name: Run linting
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, frontend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t sentinelai-backend -f backend/Dockerfile .

      - name: Build frontend Docker image
        run: docker build -t sentinelai-frontend -f frontend/Dockerfile .

      - name: Build nginx Docker image
        run: docker build -t sentinelai-nginx -f nginx/Dockerfile .